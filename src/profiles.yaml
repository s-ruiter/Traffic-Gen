# Application profiles. Each visit picks 1-3 random targets of an app.
# FortiGate application control identifies most of these by DNS/SNI/certificate,
# so hitting the real hostnames over TLS is enough.
#   urls:      HTTP(S) GET targets
#   stun:      host:port UDP STUN probe (+ optional RTP-like burst via udp_burst_s)
#   ping:      ICMP targets (SD-WAN health/latency style)
#   max_bytes: max bytes read per URL (default 400000)
# Copy to /etc/trafficgen/profiles.yaml to override (that file replaces this one).
apps:
  # ---------------- Microsoft 365
  outlook:      {group: office365, weight: 5, urls: ["https://outlook.office365.com/", "https://outlook.office.com/mail/", "https://autodiscover-s.outlook.com/"]}
  m365-login:   {group: office365, weight: 3, urls: ["https://login.microsoftonline.com/", "https://login.live.com/", "https://aadcdn.msauth.net/"]}
  sharepoint:   {group: office365, weight: 3, urls: ["https://www.office.com/", "https://res.cdn.office.net/", "https://officeapps.live.com/"]}
  onedrive:     {group: office365, weight: 2, urls: ["https://onedrive.live.com/", "https://graph.microsoft.com/", "https://api.onedrive.com/"]}

  # ---------------- Collaboration / video
  teams:
    group: collab
    weight: 6
    urls: ["https://teams.microsoft.com/", "https://statics.teams.cdn.office.net/", "https://teams.live.com/", "https://presence.teams.microsoft.com/"]
    stun: ["worldaz.tr.teams.microsoft.com:3478"]
    udp_burst_s: 8
  zoom:
    group: collab
    weight: 3
    urls: ["https://zoom.us/", "https://us02web.zoom.us/", "https://st1.zoom.us/"]
  webex:        {group: collab, weight: 2, urls: ["https://www.webex.com/", "https://web.webex.com/"]}
  slack:        {group: collab, weight: 2, urls: ["https://slack.com/", "https://app.slack.com/", "https://slack-edge.com/"]}
  google-meet:
    group: collab
    weight: 2
    urls: ["https://meet.google.com/"]
    stun: ["stun.l.google.com:19302"]
    udp_burst_s: 5

  # ---------------- Streaming
  netflix:      {group: streaming, weight: 6, max_bytes: 3000000, urls: ["https://www.netflix.com/", "https://assets.nflxext.com/", "https://api-global.netflix.com/", "https://secure.netflix.com/", "https://fast.com/"]}
  youtube:      {group: streaming, weight: 6, max_bytes: 3000000, urls: ["https://www.youtube.com/", "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg", "https://www.youtube.com/embed/dQw4w9WgXcQ", "https://www.gstatic.com/youtube/"]}
  spotify:      {group: streaming, weight: 4, urls: ["https://open.spotify.com/", "https://api.spotify.com/", "https://i.scdn.co/"]}
  disneyplus:   {group: streaming, weight: 2, urls: ["https://www.disneyplus.com/", "https://static-assets.bamgrid.com/"]}
  primevideo:   {group: streaming, weight: 2, urls: ["https://www.primevideo.com/", "https://m.media-amazon.com/"]}
  twitch:       {group: streaming, weight: 2, urls: ["https://www.twitch.tv/", "https://static.twitchcdn.net/"]}
  npo:          {group: streaming, weight: 2, urls: ["https://www.npostart.nl/", "https://www.nos.nl/"]}

  # ---------------- Social
  facebook:     {group: social, weight: 6, urls: ["https://www.facebook.com/", "https://static.xx.fbcdn.net/", "https://graph.facebook.com/", "https://connect.facebook.net/en_US/sdk.js"]}
  instagram:    {group: social, weight: 5, urls: ["https://www.instagram.com/", "https://static.cdninstagram.com/"]}
  whatsapp:     {group: social, weight: 3, urls: ["https://web.whatsapp.com/", "https://static.whatsapp.net/"]}
  linkedin:     {group: social, weight: 4, urls: ["https://www.linkedin.com/", "https://static.licdn.com/"]}
  x-twitter:    {group: social, weight: 3, urls: ["https://x.com/", "https://abs.twimg.com/"]}
  tiktok:       {group: social, weight: 3, urls: ["https://www.tiktok.com/", "https://sf16-website-login.neutral.ttwstatic.com/"]}
  reddit:       {group: social, weight: 2, urls: ["https://www.reddit.com/", "https://www.redditstatic.com/"]}

  # ---------------- SaaS / business
  salesforce:   {group: saas, weight: 3, urls: ["https://login.salesforce.com/", "https://www.salesforce.com/"]}
  google-ws:    {group: saas, weight: 4, urls: ["https://mail.google.com/", "https://drive.google.com/", "https://docs.google.com/", "https://calendar.google.com/"]}
  dropbox:      {group: saas, weight: 2, urls: ["https://www.dropbox.com/", "https://cfl.dropboxstatic.com/"]}
  box:          {group: saas, weight: 1, urls: ["https://account.box.com/login"]}
  github:       {group: saas, weight: 2, urls: ["https://github.com/", "https://api.github.com/", "https://raw.githubusercontent.com/"]}
  aws-console:  {group: saas, weight: 1, urls: ["https://aws.amazon.com/", "https://console.aws.amazon.com/"]}
  adobe:        {group: saas, weight: 1, urls: ["https://www.adobe.com/", "https://acrobat.adobe.com/"]}
  servicenow:   {group: saas, weight: 1, urls: ["https://www.servicenow.com/"]}

  # ---------------- General web
  search:       {group: web, weight: 5, urls: ["https://www.google.com/search?q=weer+amsterdam", "https://www.bing.com/search?q=nieuws", "https://duckduckgo.com/?q=fortinet"]}
  news:         {group: web, weight: 4, urls: ["https://nos.nl/", "https://www.nu.nl/", "https://www.telegraaf.nl/", "https://www.bbc.com/news", "https://tweakers.net/"]}
  shopping:     {group: web, weight: 3, urls: ["https://www.bol.com/", "https://www.amazon.nl/", "https://www.coolblue.nl/"]}
  wikipedia:    {group: web, weight: 2, urls: ["https://nl.wikipedia.org/wiki/Hoofdpagina", "https://en.wikipedia.org/wiki/Fortinet"]}
  http-plain:   {group: web, weight: 1, urls: ["http://neverssl.com/", "http://example.com/"]}

  # ---------------- OS / software updates
  windows-update: {group: updates, weight: 3, max_bytes: 2000000, urls: ["http://download.windowsupdate.com/", "https://update.microsoft.com/", "https://www.msftconnecttest.com/connecttest.txt"]}
  apple-update:   {group: updates, weight: 2, urls: ["https://swscan.apple.com/", "https://gdmf.apple.com/"]}
  linux-mirror:   {group: updates, weight: 2, urls: ["http://deb.debian.org/debian/dists/stable/Release", "http://archive.ubuntu.com/ubuntu/dists/jammy/Release"]}

  # ---------------- Bulk download (load for SD-WAN link / bandwidth tests)
  speedtest-tele2: {group: download, weight: 2, max_bytes: 10485760, urls: ["http://speedtest.tele2.net/10MB.zip"]}
  speedtest-ovh:   {group: download, weight: 2, max_bytes: 10485760, urls: ["https://proof.ovh.net/files/10Mb.dat"]}
  speedtest-cf:    {group: download, weight: 2, max_bytes: 10485760, urls: ["https://speed.cloudflare.com/__down?bytes=10000000"]}

  # ---------------- SD-WAN probes (latency / jitter / loss / connectivity checks)
  icmp-dns:     {group: sdwan, weight: 3, ping: ["8.8.8.8", "1.1.1.1", "9.9.9.9"]}
  captive:      {group: sdwan, weight: 3, urls: ["http://connectivitycheck.gstatic.com/generate_204", "http://detectportal.firefox.com/success.txt", "http://www.msftconnecttest.com/connecttest.txt"]}
  cloud-ping:   {group: sdwan, weight: 2, ping: ["www.microsoft.com", "www.google.com", "aws.amazon.com"]}

  # ---------------- Web filter test (disabled by default; expect "blocked" on FortiGate)
  # Hostnames are only fetched (GET /), nothing is submitted. Adjust to your policy.
  wf-gambling:  {group: webfilter, weight: 2, urls: ["https://www.bet365.com/", "https://www.unibet.com/", "https://www.pokerstars.com/"]}
  wf-adult:     {group: webfilter, weight: 1, urls: ["https://www.playboy.com/"]}
  wf-proxy:     {group: webfilter, weight: 2, urls: ["https://www.hidemyass.com/", "https://www.proxysite.com/", "https://www.torproject.org/"]}
  wf-p2p:       {group: webfilter, weight: 1, urls: ["https://thepiratebay.org/", "https://www.utorrent.com/"]}
  wf-games:     {group: webfilter, weight: 2, urls: ["https://store.steampowered.com/", "https://www.roblox.com/", "https://www.epicgames.com/"]}
  wf-social-misc: {group: webfilter, weight: 1, urls: ["https://www.pinterest.com/", "https://www.snapchat.com/"]}

  # ---------------- Malware / AV tests (group "malware", disabled by default)
  # ONLY standard, harmless detection-test files are used (EICAR, WICAR). Nothing is saved to disk.
  # expect: block  -> a 200 response with the file counts as MISSED, a block page / reset as DETECTED.
  # Plain HTTP (AV works without SSL inspection) - only WICAR still serves EICAR over HTTP.
  eicar-http:   {group: malware, weight: 3, expect: block, max_bytes: 100000, urls: ["http://malware.wicar.org/data/eicar.com"]}
  # HTTPS: only detectable when the policy uses SSL deep inspection (otherwise expect "missed").
  eicar-https:  {group: malware, weight: 3, expect: block, max_bytes: 100000, urls: ["https://secure.eicar.org/eicar.com", "https://secure.eicar.org/eicar.com.txt"]}
  eicar-zip:    {group: malware, weight: 2, expect: block, max_bytes: 100000, urls: ["https://secure.eicar.org/eicar_com.zip"]}
  # Informational (no pass/fail expectation): exploit-test pages and an IDS test response.
  wicar-pages:  {group: malware, weight: 1, max_bytes: 100000, urls: ["http://malware.wicar.org/data/ms14_064_ole_not_xp.html", "http://malware.wicar.org/data/js_crypto_miner.html"]}
  ids-testnids: {group: malware, weight: 1, max_bytes: 20000, urls: ["http://testmynids.org/uid/index.html"]}

  # ---------------- IOC / botnet-like behaviour (group "ioc", disabled by default)
  # Only DNS queries and bare TCP connects (no payload) are ever sent to indicators; nothing is downloaded from them.
  # Compare the sent list in requests.log with the FortiGate botnet / DNS filter / IPS logs.
  ioc-dga:      {group: ioc, weight: 4, dga: 5}                      # DGA-like lookups (NXDOMAIN storm)
  ioc-dnstunnel: {group: ioc, weight: 2, tunnel: ["example.com"]}    # long hex subdomains, TXT queries
  ioc-ddns:     {group: ioc, weight: 2, dns: ["test-host.duckdns.org", "test-host.ddns.net", "test-host.no-ip.org", "test-host.hopto.org"]}
  ioc-mining-dns: {group: ioc, weight: 2, dns: ["pool.supportxmr.com", "xmr.pool.minergate.com", "pool.minexmr.com", "xmrpool.eu"]}
  ioc-mining-tcp: {group: ioc, weight: 1, connect: ["pool.supportxmr.com:3333", "pool.minexmr.com:4444"]}   # needs "TCP connect" switch
  ioc-tor:      {group: ioc, weight: 1, connect: ["128.31.0.34:9131", "86.59.21.38:443", "194.109.206.212:443"]}  # Tor directory authorities; needs "TCP connect" switch
  ioc-feodo-c2: {group: ioc, weight: 2, feed: feodo}               # Feodo botnet C2 IPs; needs both IOC switches
